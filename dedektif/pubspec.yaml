name: dedektif
description: "Türkçe dedektif bulmaca oyunu."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  in_app_purchase: ^3.3.1
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # Klasörler bütün olarak paketlenir: yeni vaka/görsel/ses için buraya dokunmak gerekmez.
  # (Alt klasörler otomatik eklenmez; dosyaları doğrudan bu klasörlere koy.)
  assets:
    - assets/cases/
    - assets/images/
    - assets/audio/


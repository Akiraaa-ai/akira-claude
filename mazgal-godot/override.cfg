; SADECE TEST (alp, 4 Kasım): zayıf ekran kartında oyuna girebilmek için en hafif ayarlar.
; Godot bu dosyayı project.godot'un üstüne uygular; project.godot değişmez.
; Normale dönmek için bu dosyayı sil. Oyun yayınlanmadan önce silinecek.
[rendering]
renderer/rendering_method="gl_compatibility"
renderer/rendering_method.mobile="gl_compatibility"
lights_and_shadows/directional_shadow/size=1024
lights_and_shadows/positional_shadow/atlas_size=1024
anti_aliasing/quality/msaa_3d=0
scaling_3d/scale=0.5
textures/default_filters/anisotropic_filtering_level=0
